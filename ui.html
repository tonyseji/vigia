<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Muebles · lista de precios</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛋️</text></svg>">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d1b17;--mut:#6f6a60;--line:#e6e1d6;--acc:#2f6f4e;--acc2:#e8f3ec;--down:#1f7a3f;--up:#b3261e;--warn:#8a5a00;--warnbg:#fff4d6;--r:14px}
@media(prefers-color-scheme:dark){:root{--bg:#151412;--card:#1f1d1a;--ink:#f1ede4;--mut:#a39c8f;--line:#2f2c27;--acc:#6dbf8e;--acc2:#1d2e25;--down:#6dbf8e;--up:#ff7b72;--warn:#e6b455;--warnbg:#3a2f14}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:40px}
a{color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:19px;margin:0;flex:1;letter-spacing:-.01em}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.small{padding:5px 9px;font-size:13px;font-weight:500}
.btn:disabled{opacity:.55;cursor:default}
main{max-width:1100px;margin:0 auto;padding:12px 14px}
.add{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px;grid-template-columns:1fr}
.add .row{display:flex;gap:8px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 11px;font:inherit}
textarea{min-height:60px;resize:vertical}
.hint{font-size:12.5px;color:var(--mut)}
.summary{display:flex;gap:14px;flex-wrap:wrap;margin:14px 2px 6px;font-size:13px;color:var(--mut)}
.summary b{color:var(--ink);font-size:15px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px;align-items:center}
.tools input,.tools select{width:auto;flex:1;min-width:120px}
.tools label{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:5px;white-space:nowrap}
h2.cat{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:18px 2px 8px;display:flex;justify-content:space-between;align-items:baseline}
h2.cat span{font-weight:500;font-size:12px;text-transform:none;letter-spacing:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
@media(min-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.card .img{aspect-ratio:1/1;background:var(--bg);display:block;position:relative}
.card .img img{width:100%;height:100%;object-fit:cover;display:block}
.card .img .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px;opacity:.4}
.card .body{padding:9px 10px 10px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .title{font-weight:600;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-decoration:none}
.card .dom{font-size:12px;color:var(--mut)}
.price{display:flex;align-items:baseline;gap:8px;margin-top:2px}
.price .now{font-size:20px;font-weight:700;letter-spacing:-.02em}
.price .none{font-size:13px;color:var(--warn);background:var(--warnbg);padding:2px 7px;border-radius:7px}
.badge{font-size:12px;font-weight:700;padding:2px 7px;border-radius:7px;background:var(--acc2)}
.badge.down{color:var(--down)}.badge.up{color:var(--up)}
.meta{font-size:12px;color:var(--mut)}
.notes{font-size:12.5px;background:var(--bg);border-radius:8px;padding:5px 7px;white-space:pre-wrap}
.actions{display:flex;gap:6px;margin-top:auto;padding-top:6px}
.actions .btn{flex:1}
.hist{font-size:12px;color:var(--mut);border-top:1px dashed var(--line);margin-top:6px;padding-top:6px;display:none}
.hist.open{display:block}
.hist div{display:flex;justify-content:space-between}
.err{font-size:11.5px;color:var(--warn)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:92vw;box-shadow:0 8px 30px rgba(0,0,0,.25);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
dialog{border:none;border-radius:16px;padding:0;max-width:440px;width:92vw;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{padding:16px;display:grid;gap:10px}
dialog h3{margin:0 0 4px;font-size:16px}
.lbl{font-size:12.5px;color:var(--mut);margin-bottom:3px;display:block}
.empty{text-align:center;color:var(--mut);padding:50px 10px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
.gate{max-width:380px;margin:80px auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:10px}
</style>
</head>
<body>
<header>
  <h1>🛋️ Muebles</h1>
  <input id="who" placeholder="Tu nombre" style="width:120px;padding:6px 9px;font-size:13px" title="Quién añade (opcional)">
  <button class="btn primary" id="refreshBtn">↻ Actualizar precios</button>
</header>
<main id="main"></main>
<div class="toast" id="toast"></div>

<dialog id="dlg">
  <form method="dialog" id="editForm">
    <h3>Editar artículo</h3>
    <div><span class="lbl">Título</span><input name="title"></div>
    <div><span class="lbl">Categoría</span><input name="category" list="cats"></div>
    <div><span class="lbl">Precio actual (manual, €)</span><input name="price" inputmode="decimal" placeholder="Solo si el automático falla o quieres corregirlo"></div>
    <div><span class="lbl">Notas (medidas, color, dudas…)</span><textarea name="notes"></textarea></div>
    <div><span class="lbl">Imagen (URL)</span><input name="image_url"></div>
    <div class="row" style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn" value="cancel" type="button" id="cancelEdit">Cancelar</button>
      <button class="btn primary" value="ok">Guardar</button>
    </div>
  </form>
</dialog>
<datalist id="cats"></datalist>

<script>
(function(){
  var DEFAULT_CATS=["Salón","Sofá","Dormitorio","Cocina","Comedor","Baño","Oficina","Iluminación","Decoración","Exterior","Almacenaje","Otros"];
  var qs=new URLSearchParams(location.search);
  var KEY=qs.get("k")||localStorage.getItem("mk")||"";
  if(qs.get("k")){localStorage.setItem("mk",qs.get("k"));history.replaceState(null,"",location.pathname);}
  var main=document.getElementById("main");
  var who=document.getElementById("who");
  who.value=localStorage.getItem("mname")||"";
  who.addEventListener("change",function(){localStorage.setItem("mname",who.value.trim());});

  var state={items:[],history:{},sort:localStorage.getItem("msort")||"drop",onlyDrops:false,q:""};
  var toastT;
  function toast(msg,ms){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("show")},ms||2800);}
  function api(path,opts){
    opts=opts||{};opts.headers=Object.assign({"x-key":KEY},opts.headers||{});
    if(opts.body&&typeof opts.body!=="string"){opts.headers["Content-Type"]="application/json";opts.body=JSON.stringify(opts.body);}
    return fetch(location.pathname.replace(/\/+$/,"")+"/api/"+path,opts).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||("HTTP "+r.status));return j;});});
  }
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function eur(n){if(n==null)return "";return Number(n).toLocaleString("es-ES",{minimumFractionDigits:0,maximumFractionDigits:2})+" €";}
  function fdate(s){if(!s)return "";var d=new Date(s);return d.toLocaleDateString("es-ES",{day:"2-digit",month:"short"});}
  function pct(a,b){if(a==null||b==null||!Number(b))return null;return Math.round((Number(a)-Number(b))/Number(b)*100);}

  if(!KEY){
    main.innerHTML='<div class="gate"><h3 style="margin:0">Acceso</h3><p class="hint">Abre el enlace completo que te han pasado (lleva la clave) o pégala aquí.</p><input id="kIn" placeholder="Clave"><button class="btn primary" id="kBtn">Entrar</button></div>';
    document.getElementById("kBtn").onclick=function(){var k=document.getElementById("kIn").value.trim();if(k){localStorage.setItem("mk",k);location.reload();}};
    document.getElementById("refreshBtn").style.display="none";return;
  }

  function load(){
    return api("items").then(function(j){state.items=j.items;state.history=j.history||{};render();}).catch(function(e){
      if(/401/.test(e.message)){localStorage.removeItem("mk");location.reload();return;}
      main.innerHTML='<div class="empty">Error cargando: '+esc(e.message)+'</div>';
    });
  }

  function cats(){var s={};DEFAULT_CATS.forEach(function(c){s[c]=1});state.items.forEach(function(i){if(i.category)s[i.category]=1});return Object.keys(s);}

  function render(){
    document.getElementById("cats").innerHTML=cats().map(function(c){return '<option value="'+esc(c)+'">'}).join("");
    var items=state.items.filter(function(i){
      if(state.onlyDrops&&!(i.current_price!=null&&i.first_price!=null&&Number(i.current_price)<Number(i.first_price)))return false;
      if(state.q){var q=state.q.toLowerCase();return (i.title||"").toLowerCase().indexOf(q)>=0||(i.notes||"").toLowerCase().indexOf(q)>=0||(i.domain||"").toLowerCase().indexOf(q)>=0||(i.category||"").toLowerCase().indexOf(q)>=0;}
      return true;
    });
    var tot=0,tot0=0,n=0;
    state.items.forEach(function(i){if(i.current_price!=null){tot+=Number(i.current_price);tot0+=Number(i.first_price!=null?i.first_price:i.current_price);n++;}});
    var drops=state.items.filter(function(i){return i.current_price!=null&&i.first_price!=null&&Number(i.current_price)<Number(i.first_price)}).length;
    var last=state.items.reduce(function(m,i){return i.last_checked_at>m?i.last_checked_at:m},"");
    var html='';
    html+='<form class="add" id="addForm">'+
      '<div class="row"><input name="url" id="urlIn" placeholder="Pega la URL del producto" inputmode="url" autocomplete="off" required><button class="btn small" type="button" id="pasteBtn" title="Pegar del portapapeles">📋</button></div>'+
      '<div class="row"><input name="category" list="cats" placeholder="Categoría (Sofá, Dormitorio…)" value="'+esc(localStorage.getItem("mcat")||"")+'"><input name="notes" placeholder="Nota breve (opcional)"></div>'+
      '<div class="row" style="justify-content:space-between;align-items:center"><span class="hint">Guardo imagen, título y precio de hoy; luego voy siguiendo el precio.</span><button class="btn primary" id="addBtn">＋ Añadir</button></div>'+
      '</form>';
    html+='<div class="summary"><div><b>'+state.items.length+'</b> artículos</div><div><b>'+drops+'</b> con bajada</div><div>Total ahora <b>'+eur(tot)+'</b>'+(n&&tot0!==tot?' <span class="badge '+(tot<tot0?'down':'up')+'">'+(tot<tot0?'':'+')+pct(tot,tot0)+'%</span> vs inicial '+eur(tot0):'')+'</div>'+(last?'<div>Última revisión '+esc(new Date(last).toLocaleString("es-ES",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}))+'</div>':'')+'</div>';
    html+='<div class="tools"><input id="qIn" placeholder="Buscar…" value="'+esc(state.q)+'"><select id="sortSel">'+
      '<option value="drop"'+(state.sort==="drop"?" selected":"")+'>Mayor bajada</option>'+
      '<option value="new"'+(state.sort==="new"?" selected":"")+'>Más recientes</option>'+
      '<option value="cheap"'+(state.sort==="cheap"?" selected":"")+'>Más baratos</option>'+
      '<option value="exp"'+(state.sort==="exp"?" selected":"")+'>Más caros</option></select>'+
      '<label><input type="checkbox" id="onlyDrops"'+(state.onlyDrops?" checked":"")+' style="width:auto"> Solo bajadas</label></div>';
    if(!state.items.length){html+='<div class="empty">Todavía no hay nada. Pega la primera URL arriba 👆</div>';}
    var groups={};items.forEach(function(i){var c=i.category||"Sin categoría";(groups[c]=groups[c]||[]).push(i)});
    Object.keys(groups).sort(function(a,b){return a.localeCompare(b,"es")}).forEach(function(c){
      var arr=groups[c].slice().sort(sorter());
      var sum=arr.reduce(function(s,i){return s+(i.current_price!=null?Number(i.current_price):0)},0);
      html+='<h2 class="cat">'+esc(c)+'<span>'+arr.length+' · '+eur(sum)+'</span></h2><div class="grid">'+arr.map(card).join("")+'</div>';
    });
    main.innerHTML=html;
    bind();
  }
  function sorter(){
    if(state.sort==="new")return function(a,b){return a.created_at<b.created_at?1:-1};
    if(state.sort==="cheap")return function(a,b){return (a.current_price==null?1e12:Number(a.current_price))-(b.current_price==null?1e12:Number(b.current_price))};
    if(state.sort==="exp")return function(a,b){return (b.current_price==null?-1:Number(b.current_price))-(a.current_price==null?-1:Number(a.current_price))};
    return function(a,b){var pa=pct(a.current_price,a.first_price),pb=pct(b.current_price,b.first_price);return (pa==null?1:pa)-(pb==null?1:pb)};
  }
  function card(i){
    var p=pct(i.current_price,i.first_price);
    var badge=p==null||p===0?'':'<span class="badge '+(p<0?'down':'up')+'">'+(p>0?'+':'')+p+'%</span>';
    var priceHtml=i.current_price!=null?'<span class="now">'+eur(i.current_price)+'</span>'+badge:'<span class="none">Sin precio · edita</span>';
    var ref=[];if(i.first_price!=null&&Number(i.first_price)!==Number(i.current_price))ref.push("Inicial "+eur(i.first_price));
    if(i.min_price!=null&&Number(i.min_price)!==Number(i.current_price))ref.push("Mín "+eur(i.min_price));
    if(i.max_price!=null&&Number(i.max_price)!==Number(i.current_price))ref.push("Máx "+eur(i.max_price));
    var h=(state.history[i.id]||[]);
    return '<div class="card" data-id="'+i.id+'">'+
      '<a class="img" href="'+esc(i.url)+'" target="_blank" rel="noopener">'+(i.image_url?'<img loading="lazy" src="'+esc(i.image_url)+'" alt="" onerror="this.style.display=\'none\';this.nextSibling.style.display=\'flex\'"><div class="ph" style="display:none">🛋️</div>':'<div class="ph">🛋️</div>')+'</a>'+
      '<div class="body">'+
      '<a class="title" href="'+esc(i.url)+'" target="_blank" rel="noopener">'+esc(i.title||i.url)+'</a>'+
      '<div class="dom">'+esc(i.domain||"")+(i.in_stock===false?' · <span style="color:var(--up)">sin stock</span>':'')+'</div>'+
      '<div class="price">'+priceHtml+'</div>'+
      (ref.length?'<div class="meta">'+ref.join(" · ")+'</div>':'')+
      '<div class="meta">Visto '+fdate(i.created_at)+(i.added_by?' · '+esc(i.added_by):'')+(i.last_checked_at?' · rev. '+fdate(i.last_checked_at):'')+'</div>'+
      (i.last_error?'<div class="err">⚠ '+esc(i.last_error)+'</div>':'')+
      (i.notes?'<div class="notes">'+esc(i.notes)+'</div>':'')+
      '<div class="actions"><button class="btn small" data-act="hist" title="Historial">📈 '+h.length+'</button><button class="btn small" data-act="edit">✎</button><button class="btn small" data-act="re" title="Releer precio">↻</button><button class="btn small" data-act="del">🗑</button></div>'+
      '<div class="hist">'+(h.length?h.slice().reverse().map(function(r){return '<div><span>'+esc(new Date(r.checked_at).toLocaleDateString("es-ES",{day:"2-digit",month:"short",year:"2-digit"}))+'</span><b>'+eur(r.price)+'</b></div>'}).join(""):'Sin historial')+'</div>'+
      '</div></div>';
  }
  function bind(){
    var f=document.getElementById("addForm");
    f.addEventListener("submit",function(e){
      e.preventDefault();
      var url=f.url.value.trim();if(!/^https?:\/\//i.test(url)){toast("Pega una URL completa (https://…)");return;}
      var btn=document.getElementById("addBtn");btn.disabled=true;btn.innerHTML='<span class="spin"></span> Leyendo…';
      localStorage.setItem("mcat",f.category.value.trim());
      api("items",{method:"POST",body:{url:url,category:f.category.value.trim(),notes:f.notes.value.trim(),added_by:who.value.trim()}}).then(function(j){
        var it=j.item;state.items.unshift(it);state.history[it.id]=j.history||[];
        render();
        if(it.current_price==null){toast("Guardado, pero no he podido leer el precio. Ponlo a mano con ✎",4500);openEdit(it);}
        else toast("Guardado: "+eur(it.current_price));
      }).catch(function(e){toast("Error: "+e.message,4500);}).then(function(){btn.disabled=false;btn.textContent="＋ Añadir";});
    });
    document.getElementById("pasteBtn").onclick=function(){if(navigator.clipboard&&navigator.clipboard.readText)navigator.clipboard.readText().then(function(t){document.getElementById("urlIn").value=t.trim();}).catch(function(){toast("No puedo leer el portapapeles; pega manualmente")});};
    document.getElementById("qIn").addEventListener("input",function(){state.q=this.value;renderKeepFocus();});
    document.getElementById("sortSel").onchange=function(){state.sort=this.value;localStorage.setItem("msort",state.sort);render();};
    document.getElementById("onlyDrops").onchange=function(){state.onlyDrops=this.checked;render();};
    main.querySelectorAll(".card [data-act]").forEach(function(b){
      b.onclick=function(){
        var id=b.closest(".card").dataset.id;var it=state.items.filter(function(x){return x.id===id})[0];
        var act=b.dataset.act;
        if(act==="hist"){b.closest(".card").querySelector(".hist").classList.toggle("open");}
        else if(act==="edit")openEdit(it);
        else if(act==="del"){if(confirm("¿Eliminar \""+(it.title||it.url)+"\"?"))api("items/"+id,{method:"DELETE"}).then(function(){state.items=state.items.filter(function(x){return x.id!==id});render();toast("Eliminado");}).catch(function(e){toast("Error: "+e.message)});}
        else if(act==="re"){b.disabled=true;b.innerHTML='<span class="spin"></span>';refresh([id]).then(function(){load()});}
      };
    });
  }
  var focusT;
  function renderKeepFocus(){clearTimeout(focusT);focusT=setTimeout(function(){var v=state.q;render();var q=document.getElementById("qIn");q.focus();q.setSelectionRange(v.length,v.length);},250);}

  var dlg=document.getElementById("dlg"),ef=document.getElementById("editForm"),editing=null;
  function openEdit(it){editing=it;ef.title.value=it.title||"";ef.category.value=it.category||"";ef.price.value="";ef.notes.value=it.notes||"";ef.image_url.value=it.image_url||"";dlg.showModal();}
  document.getElementById("cancelEdit").onclick=function(){dlg.close("cancel")};
  ef.addEventListener("submit",function(e){
    if(!editing)return;
    var body={title:ef.title.value.trim(),category:ef.category.value.trim()||"Sin categoría",notes:ef.notes.value.trim(),image_url:ef.image_url.value.trim()};
    var pr=ef.price.value.trim().replace(/[^\d.,]/g,"");
    if(pr){var n=parseFloat(pr.indexOf(",")>=0&&pr.indexOf(".")<0?pr.replace(",","."):pr.replace(/,/g,""));if(n>0)body.price=n;}
    api("items/"+editing.id,{method:"PATCH",body:body}).then(function(j){
      var idx=state.items.findIndex(function(x){return x.id===editing.id});state.items[idx]=j.item;if(j.history)state.history[editing.id]=j.history;render();toast("Guardado");
    }).catch(function(e){toast("Error: "+e.message)});
  });

  function refresh(ids){
    var chunks=[];for(var i=0;i<ids.length;i+=5)chunks.push(ids.slice(i,i+5));
    var results=[];var done=0;var btn=document.getElementById("refreshBtn");
    return chunks.reduce(function(p,ch){return p.then(function(){
      return api("refresh",{method:"POST",body:{ids:ch}}).then(function(j){results=results.concat(j.results||[]);done+=ch.length;btn.innerHTML='<span class="spin"></span> '+done+'/'+ids.length;});
    })},Promise.resolve()).then(function(){return results});
  }
  document.getElementById("refreshBtn").onclick=function(){
    var btn=this;var ids=state.items.map(function(i){return i.id});if(!ids.length){toast("No hay artículos");return;}
    btn.disabled=true;
    refresh(ids).then(function(res){
      var down=res.filter(function(r){return r.old!=null&&r.new!=null&&r.new<r.old}),up=res.filter(function(r){return r.old!=null&&r.new!=null&&r.new>r.old}),err=res.filter(function(r){return r.error});
      var msg=(down.length?down.length+" bajada"+(down.length>1?"s":"")+" ↓":"")+(up.length?(down.length?", ":"")+up.length+" subida"+(up.length>1?"s":"")+" ↑":"")+(err.length?(down.length||up.length?", ":"")+err.length+" sin leer ⚠":"");
      toast(msg||"Todo igual que antes ✓",5000);
      return load();
    }).catch(function(e){toast("Error: "+e.message,5000)}).then(function(){btn.disabled=false;btn.textContent="↻ Actualizar precios";});
  };

  load();
})();
</script>
</body>
</html>
